{% extends 'base.html' %}

{% block title %}
Create Problem
{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-10 px-4">
    <div class="bg-white shadow-md rounded-lg p-8 border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Create New Problem</h1>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-1">
                    <label class="block text-sm font-semibold text-gray-700">Problem ID</label>
                    <input type="text" name="problem_id" placeholder="e.g. 1000A" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700">Title</label>
                    <input type="text" name="title" placeholder="Problem Name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Description</label>
                <textarea name="description" rows="4" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Input Description</label>
                    <textarea name="input_description" rows="3" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Output Description</label>
                    <textarea name="output_description" rows="3" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border"></textarea>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Constraints</label>
                <textarea name="constraints" rows="2" placeholder="e.g. 1 <= N <= 10^5" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-md">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Difficulty</label>
                    <select name="difficulty" class="mt-1 block w-full bg-white border-gray-300 rounded-md shadow-sm p-2 border">
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Time Limit (s)</label>
                    <input type="number" step="0.1" name="time_limit" value="1.0" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Memory (MB)</label>
                    <input type="number" name="memory_limit" value="256" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 border">
                </div>
            </div>

            <div class="flex items-center">
                <input type="checkbox" name="is_public" checked class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label class="ml-2 block text-sm text-gray-900 font-medium">Make this problem public</label>
            </div>

            <div class="pt-4 border-t border-gray-100 flex justify-end">
                <button type="submit" class="bg-gray-900 hover:bg-gray-800 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                    Save Problem
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
