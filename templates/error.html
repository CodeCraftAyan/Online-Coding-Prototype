<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ sys_status_msg }} - {{ code }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
    @keyframes ghost-float {
        0% { 
            transform: translateY(0px) scale(1);
            filter: grayscale(1) opacity(0.7) blur(2px);
        }
        50% { 
            transform: translateY(-15px) scale(1.03);
            filter: grayscale(0.6) opacity(1) blur(0px);
        }
        100% { 
            transform: translateY(0px) scale(1);
            filter: grayscale(1) opacity(0.7) blur(2px);
        }
    }
    .animate-ghost {
        animation: ghost-float 8s ease-in-out infinite;
    }
    </style>
</head>
<body>

    <main class="min-h-[100vh] flex items-center justify-center bg-white px-6">
        <div class="max-w-5xl w-full flex flex-col lg:flex-row items-center justify-center gap-16 py-10">
            
            <div class="relative shrink-0">
                <div class="absolute bottom-[-20px] left-1/2 -translate-x-1/2 w-1/2 h-4 bg-slate-900/5 blur-xl rounded-full"></div>
                
                <img src="https://i.pinimg.com/736x/45/57/b7/4557b7dcd032bec32156f01a06383067.jpg" 
                     alt="404 Illustration" 
                     class="animate-ghost relative mx-auto h-72 lg:h-96 object-cover rounded-3xl shadow-sm">
            </div>
    
            <div class="text-center lg:text-left space-y-10 max-w-sm">
                <div class="space-y-4">
                    <h1 class="text-7xl font-black tracking-tighter leading-none text-gray-200">
                        {{ code }}
                    </h1>
                    <h2 class="text-3xl font-bold text-slate-900 tracking-tight">{{ title }}</h2>
                    <p class="text-slate-500 text-sm leading-relaxed max-w-xs">
                        {{ message }}
                    </p>
                </div>
        
                <div class="flex flex-col sm:flex-row items-center lg:justify-start justify-center gap-4">
                    <a href="{% url 'index' %}" 
                       class="w-full sm:w-auto px-10 py-3 bg-slate-900 text-white text-sm font-semibold rounded-xl hover:bg-black transition-all active:scale-95 shadow-lg shadow-slate-200">
                       Return to Safety
                    </a>
                    <button onclick="history.back()" 
                            class="w-full sm:w-auto px-8 py-3 bg-white text-slate-600 text-sm font-semibold rounded-xl border border-slate-200 hover:bg-slate-50 transition-all active:scale-95">
                        Go Back
                    </button>
                </div>
        
                <p class="text-[10px] font-mono uppercase tracking-widest text-gray-400">
                    System Status: <span class="text-slate-600">{{ sys_status_msg }}</span>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
