{% load static %}

<div id="video-overlay"
     class="hidden fixed inset-0 z-[9999] bg-black flex items-center justify-center flex-col text-white">

    <div class="text-center">
        <p class="text-xl font-light text-gray-200 animate-pulse">
            You're part of the game now
        </p>
        <p id="tap-text" class="text-sm font-medium text-white animate-pulse tracking-widest opacity-80">
            Tap to proceed
        </p>
    </div>

    <video
        id="promo-video"
        class="w-full h-full object-cover hidden"
        src="{% static 'joker_shuffled.mp4' %}"
        playsinline>
    </video>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const overlay = document.getElementById('video-overlay');
    const video = document.getElementById('promo-video');
    const tapText = document.getElementById('tap-text');

    let pendingTrigger = null;

    function showTapToPlay(triggerTime) {
        pendingTrigger = triggerTime;

        overlay.classList.remove("hidden");
        tapText.classList.remove("hidden");
        video.classList.add("hidden");

        console.log("🟡 Waiting for user interaction...");
    }

    function playVideo() {
        if (!pendingTrigger) return;

        localStorage.setItem("video_trigger", pendingTrigger);

        tapText.classList.add("hidden");
        video.classList.remove("hidden");

        video.currentTime = 0;
        video.muted = false;

        video.play().then(() => {
            console.log("🔊 Video playing with sound");
        }).catch(err => {
            console.warn("❌ Play failed:", err);
        });

        video.onended = () => {
            overlay.classList.add("hidden");
            pendingTrigger = null;
        };
    }

    // 🔥 THIS is the key (user interaction)
    overlay.addEventListener("click", playVideo);

    let socket;

    function connectWebSocket() {
        const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        socket = new WebSocket(protocol + window.location.host + "/ws/video/");

        socket.onopen = () => {
            console.log("WebSocket connected ✅");
        };

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (data.type === "ping") return;

            let trigger = String(data.video_triggered_at);
            let lastPlayed = localStorage.getItem("video_trigger");

            if (trigger !== lastPlayed) {
                showTapToPlay(trigger);
            }
        };

        socket.onclose = function() {
            console.log("WebSocket disconnected ❌");

            setTimeout(() => {
                console.log("Reconnecting...");
                connectWebSocket();
            }, 3000);
        };
    }

    connectWebSocket();

});
</script>
